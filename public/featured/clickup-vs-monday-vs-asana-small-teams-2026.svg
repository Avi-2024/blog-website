<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Ambient Grid & Glow -->
    <radialGradient id="centralGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#4f46e5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tealGlow" cx="30%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>

    <!-- Isometric Surface Gradients -->
    <linearGradient id="topCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tealTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="cyanTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="indigoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Glass Pill Gradients -->
    <linearGradient id="glassPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="amberPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="emeraldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Ambient Light Fields -->
  <rect width="1200" height="675" fill="url(#centralGlow)" />
  <rect width="1200" height="675" fill="url(#tealGlow)" />

  <!-- Background Perspective Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="150" y1="520" x2="600" y2="260" />
    <line x1="250" y1="580" x2="700" y2="320" />
    <line x1="350" y1="640" x2="800" y2="380" />
    <line x1="1050" y1="520" x2="600" y2="260" />
    <line x1="950" y1="580" x2="500" y2="320" />
    <line x1="850" y1="640" x2="400" y2="380" />
  </g>

  <!-- Large Central Isometric Base Platform -->
  <g filter="url(#cardShadow)">
    <!-- Base Top Surface -->
    <path d="M 600 190 L 980 390 L 600 590 L 220 390 Z" fill="#131d31" stroke="#334155" stroke-width="1.5" />
    <!-- Base Left Side -->
    <path d="M 220 390 L 600 590 L 600 615 L 220 415 Z" fill="#090d16" />
    <!-- Base Right Side -->
    <path d="M 600 590 L 980 390 L 980 415 L 600 615 Z" fill="#0d131f" />
  </g>

  <!-- Tier 1: ClickUp-style Modular Work Breakdown Slab (Left) -->
  <g filter="url(#cardShadow)">
    <!-- Top Face -->
    <path d="M 330 330 L 530 220 L 530 320 L 330 430 Z" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" />
    <!-- Right Extrusion -->
    <path d="M 530 220 L 550 230 L 550 330 L 530 320 Z" fill="#0f172a" />
    <!-- Bottom Extrusion -->
    <path d="M 330 430 L 530 320 L 550 330 L 350 440 Z" fill="#0b0f19" />

    <!-- Isometric Task Hierarchy Strips on Left Slab -->
    <path d="M 355 350 L 505 265 L 505 277 L 355 362 Z" fill="#38bdf8" fill-opacity="0.85" />
    <path d="M 355 375 L 475 307 L 475 319 L 355 387 Z" fill="#0ea5e9" fill-opacity="0.65" />
    <path d="M 355 400 L 450 347 L 450 359 L 355 412 Z" fill="#64748b" fill-opacity="0.5" />

    <!-- Status Nodes -->
    <ellipse cx="370" cy="342" rx="4" ry="2.5" fill="#38bdf8" />
    <ellipse cx="370" cy="367" rx="4" ry="2.5" fill="#0ea5e9" />
    <ellipse cx="370" cy="392" rx="4" ry="2.5" fill="#94a3b8" />
  </g>

  <!-- Tier 2: Monday-style Multi-Column Grid Board (Center-Right) -->
  <g filter="url(#cardShadow)">
    <!-- Top Face -->
    <path d="M 580 220 L 870 375 L 750 445 L 460 290 Z" fill="#1a2436" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
    <!-- Left Extrusion -->
    <path d="M 460 290 L 750 445 L 750 460 L 460 305 Z" fill="#0c121e" />
    <!-- Right Extrusion -->
    <path d="M 750 445 L 870 375 L 870 390 L 750 460 Z" fill="#121a29" />

    <!-- Status Column Pills (Monday-style vibrant blocks) -->
    <!-- Row 1 -->
    <path d="M 620 275 L 685 310 L 685 322 L 620 287 Z" fill="url(#emeraldPill)" />
    <path d="M 700 318 L 765 353 L 765 365 L 700 330 Z" fill="url(#amberPill)" />
    <path d="M 780 361 L 845 396 L 845 408 L 780 373 Z" fill="url(#glassPill)" />

    <!-- Row 2 -->
    <path d="M 580 297 L 645 332 L 645 344 L 580 309 Z" fill="url(#glassPill)" />
    <path d="M 660 340 L 725 375 L 725 387 L 660 352 Z" fill="url(#emeraldPill)" />
    <path d="M 740 383 L 805 418 L 805 430 L 740 395 Z" fill="url(#emeraldPill)" />

    <!-- Row 3 -->
    <path d="M 540 319 L 605 354 L 605 366 L 540 331 Z" fill="url(#amberPill)" />
    <path d="M 620 362 L 685 397 L 685 409 L 620 374 Z" fill="#64748b" fill-opacity="0.7" />
    <path d="M 700 405 L 765 440 L 765 452 L 700 417 Z" fill="url(#glassPill)" />
  </g>

  <!-- Tier 3: Asana-style Workload / Timeline Float Plate (Elevated Foreground) -->
  <g filter="url(#cardShadow)">
    <!-- Elevated Plate -->
    <path d="M 520 380 L 710 280 L 810 330 L 620 430 Z" fill="#1e1b4b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" />
    <path d="M 620 430 L 810 330 L 810 342 L 620 442 Z" fill="#0f0e26" />
    <path d="M 520 380 L 620 430 L 620 442 L 520 392 Z" fill="#17153a" />

    <!-- Timeline Dependency Connected Gantt Bars -->
    <path d="M 560 370 L 650 323 L 650 332 L 560 379 Z" fill="#c084fc" />
    <path d="M 665 335 L 755 288 L 755 297 L 665 344 Z" fill="#38bdf8" />
    
    <!-- Dependency Linking Line -->
    <path d="M 650 327 L 665 339" stroke="#e9d5ff" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- 10-Team Member Capacity Cubes (Representing the 10-Person Team Model) -->
  <g filter="url(#glowSubtle)">
    <!-- Seat Cubes Clustered on Left Terrace -->
    <!-- Cube 1 -->
    <path d="M 390 450 L 410 440 L 430 450 L 410 460 Z" fill="#38bdf8" />
    <path d="M 390 450 L 410 460 L 410 472 L 390 462 Z" fill="#0284c7" />
    <path d="M 410 460 L 430 450 L 430 462 L 410 472 Z" fill="#0369a1" />

    <!-- Cube 2 -->
    <path d="M 435 440 L 455 430 L 475 440 L 455 450 Z" fill="#38bdf8" />
    <path d="M 435 440 L 455 450 L 455 462 L 435 452 Z" fill="#0284c7" />
    <path d="M 455 450 L 475 440 L 475 452 L 455 462 Z" fill="#0369a1" />

    <!-- Cube 3 -->
    <path d="M 480 430 L 500 420 L 520 430 L 500 440 Z" fill="#818cf8" />
    <path d="M 480 430 L 500 440 L 500 452 L 480 442 Z" fill="#6366f1" />
    <path d="M 500 440 L 520 430 L 520 442 L 500 452 Z" fill="#4f46e5" />

    <!-- Cube 4 -->
    <path d="M 420 470 L 440 460 L 460 470 L 440 480 Z" fill="#818cf8" />
    <path d="M 420 470 L 440 480 L 440 492 L 420 482 Z" fill="#6366f1" />
    <path d="M 440 480 L 460 470 L 460 482 L 440 492 Z" fill="#4f46e5" />

    <!-- Cube 5 -->
    <path d="M 465 460 L 485 450 L 505 460 L 485 470 Z" fill="#34d399" />
    <path d="M 465 460 L 485 470 L 485 482 L 465 472 Z" fill="#10b981" />
    <path d="M 485 470 L 505 460 L 505 472 L 485 482 Z" fill="#059669" />

    <!-- Cube 6 -->
    <path d="M 510 450 L 530 440 L 550 450 L 530 460 Z" fill="#34d399" />
    <path d="M 510 450 L 530 460 L 530 472 L 510 462 Z" fill="#10b981" />
    <path d="M 530 460 L 550 450 L 550 472 L 530 462 Z" fill="#059669" />

    <!-- Cube 7 -->
    <path d="M 450 490 L 470 480 L 490 490 L 470 500 Z" fill="#fbbf24" />
    <path d="M 450 490 L 470 500 L 470 512 L 450 502 Z" fill="#f59e0b" />
    <path d="M 470 500 L 490 490 L 490 502 L 470 512 Z" fill="#d97706" />

    <!-- Cube 8 -->
    <path d="M 495 480 L 515 470 L 535 480 L 515 490 Z" fill="#fbbf24" />
    <path d="M 495 480 L 515 490 L 515 502 L 495 492 Z" fill="#f59e0b" />
    <path d="M 515 490 L 535 480 L 535 502 L 515 492 Z" fill="#d97706" />

    <!-- Cube 9 -->
    <path d="M 540 470 L 560 460 L 580 470 L 560 480 Z" fill="#a78bfa" />
    <path d="M 540 470 L 560 480 L 560 492 L 540 482 Z" fill="#8b5cf6" />
    <path d="M 560 480 L 580 470 L 580 482 L 560 492 Z" fill="#7c3aed" />

    <!-- Cube 10 -->
    <path d="M 585 460 L 605 450 L 625 460 L 605 470 Z" fill="#a78bfa" />
    <path d="M 585 460 L 605 470 L 605 482 L 585 472 Z" fill="#8b5cf6" />
    <path d="M 605 470 L 625 460 L 625 472 L 605 482 Z" fill="#7c3aed" />
  </g>

  <!-- Automation Hub & Integration Gateway Nodes (Top Floating Spheres) -->
  <g>
    <!-- Connector Beam Lines -->
    <line x1="600" y1="120" x2="430" y2="275" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.6" />
    <line x1="600" y1="120" x2="665" y2="255" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.6" />
    <line x1="600" y1="120" x2="710" y2="330" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.6" />

    <!-- Central Floating Diamond Automation Prism -->
    <g filter="url(#glowSubtle)">
      <polygon points="600,85 630,120 600,155 570,120" fill="#0284c7" fill-opacity="0.9" />
      <polygon points="600,85 630,120 600,125" fill="#38bdf8" />
      <polygon points="570,120 600,85 600,125" fill="#7dd3fc" />
      <polygon points="570,120 600,155 600,125" fill="#0369a1" />
      <polygon points="630,120 600,155 600,125" fill="#075985" />
    </g>

    <!-- Satellite Nodes -->
    <circle cx="430" cy="275" r="5" fill="#38bdf8" filter="url(#glowSubtle)" />
    <circle cx="665" cy="255" r="5" fill="#818cf8" filter="url(#glowSubtle)" />
    <circle cx="710" cy="330" r="5" fill="#c084fc" filter="url(#glowSubtle)" />
  </g>

  <!-- Ambient Isometric Data Beams / Highlights -->
  <path d="M 270 415 L 310 435" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M 890 355 L 930 375" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M 600 580 L 600 605" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
</svg>